<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Energy Billing Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">

        <div class="card">
            <h2>🔍 Kundenstatus & Schulden prüfen</h2>
            <div class="form-group">
                <div class="input-row">
                    <input type="email" id="search-email" placeholder="E-Mail-Adresse des Kunden eingeben...">
                    <button class="btn-primary" onclick="checkStatus()">Abfragen</button>
                </div>
            </div>
            <div id="status-result" class="info-box">
                Geben Sie eine E-Mail-Adresse ein, um den aktuellen Kontostand und KI-Benachrichtigungen zu prüfen.
            </div>
        </div>

        <div class="card">
            <h2>👤 Neuer Kunde registrieren</h2>
            <div class="form-group">
                <div class="input-row">
                    <input type="text" id="reg-name" placeholder="Name (z.B. Max)">
                    <input type="email" id="reg-email" placeholder="E-Mail (z.B. max@energie.de)">
                    <button class="btn-success" onclick="registerUser()">Registrieren</button>
                </div>
            </div>
            <div id="reg-result" class="info-box">
                Geben Sie die Kundendaten ein, um einen neuen Benutzer im System anzulegen.
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
